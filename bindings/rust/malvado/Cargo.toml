[package]
name = "malvado"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Safe owner-thread processes for the Malvado native scheduler"

[dependencies]
malvado-sys = { path = "../malvado-sys", version = "=2.0.0-alpha.7" }

[features]
default = []
assets = ["malvado-sys/assets"]
graphics = ["malvado-sys/graphics"]

[[test]]
name = "window"
path = "tests/window.rs"
harness = false
required-features = ["graphics"]

[[test]]
name = "keyboard"
path = "tests/keyboard.rs"
harness = false
required-features = ["graphics"]

[[test]]
name = "drawing"
path = "tests/drawing.rs"
harness = false
required-features = ["graphics"]

[[test]]
name = "images"
path = "tests/images.rs"
harness = false
required-features = ["graphics"]

[[test]]
name = "fonts"
path = "tests/fonts.rs"
harness = false
required-features = ["graphics"]

[[test]]
name = "input"
path = "tests/input.rs"
harness = false
required-features = ["graphics"]

[[test]]
name = "audio"
path = "tests/audio.rs"
harness = false
required-features = ["graphics"]
