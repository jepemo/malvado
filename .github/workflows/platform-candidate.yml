# Malvado 2; SPDX-License-Identifier: Apache-2.0
name: Platform candidate
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full candidate commit SHA
        required: true
        type: string
      ci:
        description: Successful CI run ID for this SHA
        required: true
        type: string
      windows:
        description: Successful Windows run ID for this SHA
        required: true
        type: string
      android:
        description: Successful Android foundation run ID for this SHA
        required: true
        type: string
      version:
        description: Optional version for a draft release bundle
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: Require all supported-platform results
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify the exact candidate revision
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.sha }}
          CI_RUN: ${{ inputs.ci }}
          WINDOWS_RUN: ${{ inputs.windows }}
          ANDROID_RUN: ${{ inputs.android }}
          CANDIDATE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/platform_candidate.py --sha "$CANDIDATE_SHA" \
            --repository "$CANDIDATE_REPOSITORY" --ci "$CI_RUN" \
            --windows "$WINDOWS_RUN" --android "$ANDROID_RUN" \
            --output platform-candidate.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci }}
          name: sdk-candidate-${{ inputs.sha }}
          path: incoming/desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.windows }}
          name: sdk-windows-${{ inputs.sha }}
          path: incoming/windows
      - name: Collect verified SDK archives
        run: |
          python3 tools/collect_platform_sdk.py --desktop incoming/desktop \
            --windows incoming/windows --report platform-candidate.json \
            --output platform-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-candidate-${{ inputs.sha }}
          path: platform-candidate/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.version != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci }}
          name: source-check-${{ inputs.sha }}
          path: incoming/source
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: inputs.version != ''
      - name: Prepare the draft release bundle
        if: inputs.version != ''
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          git fetch --depth=1 origin "$CANDIDATE_SHA"
          (
            cd docs/website
            mise install node
            mise exec -- python3 ../tools/prepare_versioned_site.py \
              "$CANDIDATE_VERSION" "$CANDIDATE_SHA" "$GITHUB_WORKSPACE/incoming/docs"
          )
          version_page="$CANDIDATE_SHA:docs/versions/$CANDIDATE_VERSION"
          if git cat-file -e "$version_page-release-notes.md"; then
            git show "$version_page-release-notes.md" > incoming/notes.md
          else
            git show "$version_page.md" > incoming/notes.md
          fi
          python3 tools/collect_release_candidate.py --platform platform-candidate \
            --source incoming/source --docs incoming/docs --notes incoming/notes.md \
            --version "$CANDIDATE_VERSION" --output release-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.version != ''
        with:
          name: release-candidate-${{ inputs.version }}-${{ inputs.sha }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 14
