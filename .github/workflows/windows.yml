# Malvado 2; SPDX-License-Identifier: Apache-2.0
name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  headless:
    name: Windows x64 MSVC ${{ matrix.kind }} SDK
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: headless
            args: --rust
            work: build-platform
          - kind: graphics
            args: --rust --graphics --cli --work build-platform-graphics
            work: build-platform-graphics
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Record native toolchain
        shell: pwsh
        run: |
          cmake --version
          rustc -vV
          python --version
          & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -format json
      - name: Verify native C, Lua and Rust
        run: mise run test-platform -- ${{ matrix.args }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-${{ matrix.kind }}-${{ github.sha }}
          path: |
            ${{ matrix.work }}/*.log
            ${{ matrix.work }}/**/atlas-pivot-crlf.json
            ${{ matrix.work }}/**/Testing/Temporary/*.log
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.kind == 'graphics'
        with:
          name: windows-players-${{ github.sha }}
          path: build-platform-graphics/players
          if-no-files-found: error
          retention-days: 3
  players:
    name: Windows players on a fresh runner
    needs: headless
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-players-${{ github.sha }}
          path: players
      - name: Run Debug and Release players without authoring tools
        shell: pwsh
        run: |
          python tests/windows_cli.py --fresh --work build-fresh-players --players players/Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_cli.py --fresh --work build-fresh-players --players players/Release
