name: Publish documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version for a candidate documentation artifact
        type: string
      revision:
        description: Full commit SHA for the candidate documentation
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'push' || (inputs.version == '' && inputs.revision == '')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Build site
        working-directory: docs/website
        run: |
          mise install node
          mise exec -- npm ci --no-audit --no-fund
          mise exec -- npm run build
      - name: Include published documentation snapshots
        working-directory: docs/website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=$(python3 ../../tools/release_notes.py snapshots)
          bundles=$(mktemp -d "${RUNNER_TEMP}/malvado-docs.XXXXXX")
          trap 'rm -rf "$bundles"' EXIT
          while IFS= read -r version; do
            [ -n "$version" ] || continue
            bundle="malvado-$version-release-bundle.tar.gz"
            gh release download "v$version" --pattern "$bundle" --dir "$bundles"
            tar -xzf "$bundles/$bundle" -C dist --strip-components=2 "./docs/$version/"
            test -s "dist/$version/index.html"
            python3 ../tools/archived_install.py "dist/$version" "$version"
          done <<< "$versions"
      - uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/website/dist
  # Deploy runs in its own job. GitHub's artifact listing is eventually
  # consistent, so a deploy-pages step in the same job as upload-pages-artifact
  # intermittently finds no artifact (actions/deploy-pages#451).
  deploy:
    if: github.event_name == 'push' || (inputs.version == '' && inputs.revision == '')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  prepare-candidate:
    if: github.event_name == 'workflow_dispatch' && (inputs.version != '' || inputs.revision != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Build the versioned snapshot
        working-directory: docs/website
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          CANDIDATE_REVISION: ${{ inputs.revision }}
        run: |
          mise install node
          mise exec -- python3 ../tools/prepare_versioned_site.py \
            "$CANDIDATE_VERSION" "$CANDIDATE_REVISION" "$GITHUB_WORKSPACE/build/candidate-docs" --require-notes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-${{ inputs.version }}-${{ inputs.revision }}
          path: build/candidate-docs/
          if-no-files-found: error
          retention-days: 14
