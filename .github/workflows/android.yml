# Malvado 2; SPDX-License-Identifier: Apache-2.0
name: Android foundation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 1'
permissions:
  contents: read
jobs:
  headless:
    name: Android API 34 x86_64 headless C and Lua
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install the Android foundation toolchain
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager "ndk;27.2.12479018" "system-images;android-34;google_apis;x86_64" "platform-tools" "emulator"
      - name: Verify Debug and Release on an isolated emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/malvado-alpha8-avd
        run: |
          mkdir -p "$ANDROID_AVD_HOME" build-android
          avdmanager create avd --name malvado-alpha8 --package "system-images;android-34;google_apis;x86_64" --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd malvado-alpha8 -port 5580 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -cores 2 -memory 2048 > build-android/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import time
          adb = str(Path(os.environ["ANDROID_HOME"]) / "platform-tools/adb")
          deadline = time.monotonic() + 240
          while time.monotonic() < deadline:
              result = subprocess.run([adb, "-s", "emulator-5580", "shell", "getprop", "sys.boot_completed"],
                                      capture_output=True, text=True, timeout=10)
              if result.returncode == 0 and result.stdout.strip() == "1":
                  break
              time.sleep(2)
          else:
              raise SystemExit("Android emulator did not boot within 240 seconds")
          PY
          mise run test-android -- --sdk "$ANDROID_HOME" --serial emulator-5580
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-foundation-${{ github.sha }}
          path: |
            build-android/*.log
            build-android/*-results.json
            build-android/toolchain.json
          if-no-files-found: warn
          retention-days: 14
