# Malvado 2; SPDX-License-Identifier: Apache-2.0
name: Android foundation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 1'
permissions:
  contents: read
jobs:
  headless:
    name: Android API 34 x86_64 ${{ matrix.config }} C and Lua
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install the Android foundation toolchain
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Verify ${{ matrix.config }} on an isolated emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/malvado-alpha8-avd
          ACCEPTANCE_CONFIG: ${{ matrix.config }}
        run: |
          mkdir -p build-android
          config="$ACCEPTANCE_CONFIG"
          python3 tools/android_sdk.py --output build-android/linux-sdk
          python3 tools/android_archives.py --output build-android/pinned
          acceptance_sdk="$PWD/build-android/linux-sdk"
          ln -s "$PWD/build-android/pinned/emulator" "$acceptance_sdk/emulator"
          mkdir -p "$acceptance_sdk/system-images/android-34/google_apis"
          ln -s "$PWD/build-android/pinned/x86_64" "$acceptance_sdk/system-images/android-34/google_apis/x86_64"
          # Prevent a preinstalled adb server from supplying another revision.
          "$ANDROID_HOME/platform-tools/adb" kill-server
          "$acceptance_sdk/platform-tools/adb" start-server
          python3 tools/android_avd.py --output "$ANDROID_AVD_HOME" --image build-android/pinned/x86_64
          "$PWD/build-android/pinned/emulator/emulator" -avd malvado-alpha8 -port 5580 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -cores 2 -memory 2048 > build-android/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          python3 tools/android_boot.py --adb "$acceptance_sdk/platform-tools/adb" --serial emulator-5580
          rustup target add x86_64-linux-android
          mise run test-android-rust -- --assets --sdk "$acceptance_sdk" --serial emulator-5580 --config "$config"
          mise run test-android -- --sdk "$acceptance_sdk" --serial emulator-5580 --config "$config"
          mise run test-android-window -- --sdk "$acceptance_sdk" --serial emulator-5580 --installed-sdk --config "$config" --work "build-android/window-$config"
          for mode in none back resume touch keyboard keyboard-resume; do
            extra=()
            if [ "$mode" != none ]; then extra=(--lifecycle "$mode"); fi
            work="build-android/rust-window-$config"
            mise run test-android-window -- --sdk "$acceptance_sdk" --serial emulator-5580 --language rust --installed-sdk --config "$config" --work "$work" "${extra[@]}"
            cp "$work/window.log" "$work/$mode.log"
            cp "$work/results.json" "$work/$mode-results.json"
            for image in before resumed released keyboard; do
              if [ -f "$work/$image.png" ]; then cp "$work/$image.png" "$work/$mode-$image.png"; fi
            done
          done
          for mode in normal resume; do
            extra=()
            if [ "$mode" = resume ]; then extra=(--lifecycle resume); fi
            work="build-android/rust-window-$config"
            mise run test-android-window -- --sdk "$acceptance_sdk" --serial emulator-5580 --language rust --installed-sdk --config "$config" --audio --work "$work" "${extra[@]}"
            cp "$work/window.log" "$work/audio-$mode.log"
            cp "$work/results.json" "$work/audio-$mode-results.json"
            for image in before resumed; do
              if [ -f "$work/$image.png" ]; then cp "$work/$image.png" "$work/audio-$mode-$image.png"; fi
            done
          done
          for failure in process missing-image; do
            work="build-android/rust-window-$config"
            mise run test-android-window -- --sdk "$acceptance_sdk" --serial emulator-5580 --language rust --installed-sdk --config "$config" --failure "$failure" --work "$work"
            cp "$work/window.log" "$work/$failure-error.log"
            cp "$work/results.json" "$work/$failure-error-results.json"
          done
          for config in "$ACCEPTANCE_CONFIG"; do
            for entry in explicit declarative; do
              for failure in none process missing-image; do
                work="build-android/lua-$config"
                mise run test-android-window -- --sdk "$acceptance_sdk" --serial emulator-5580 --language lua --entry "$entry" --failure "$failure" --config "$config" --work "$work"
                cp "$work/window.log" "$work/$entry-$failure.log"
                cp "$work/results.json" "$work/$entry-$failure-results.json"
              done
            done
          done
          for config in "$ACCEPTANCE_CONFIG"; do
            for lifecycle in back resume touch keyboard keyboard-resume; do
              work="build-android/c-lifecycle-$config"
              mise run test-android-window -- --sdk "$acceptance_sdk" --serial emulator-5580 --installed-sdk --lifecycle "$lifecycle" --config "$config" --work "$work"
              cp "$work/window.log" "$work/$lifecycle.log"
              cp "$work/results.json" "$work/$lifecycle-results.json"
              for image in before resumed released keyboard; do
                if [ -f "$work/$image.png" ]; then cp "$work/$image.png" "$work/$lifecycle-$image.png"; fi
              done
              for entry in explicit declarative; do
                work="build-android/lua-$config"
                mise run test-android-window -- --sdk "$acceptance_sdk" --serial emulator-5580 --language lua --entry "$entry" --lifecycle "$lifecycle" --config "$config" --work "$work"
                cp "$work/window.log" "$work/$entry-$lifecycle.log"
                cp "$work/results.json" "$work/$entry-$lifecycle-results.json"
                for image in before resumed released keyboard; do
                  if [ -f "$work/$image.png" ]; then cp "$work/$image.png" "$work/$entry-$lifecycle-$image.png"; fi
                done
              done
            done
          done
          for config in "$ACCEPTANCE_CONFIG"; do
            for mode in normal resume; do
              extra=()
              if [ "$mode" = resume ]; then extra=(--lifecycle resume); fi
              work="build-android/c-audio-$config"
              mise run test-android-window -- --sdk "$acceptance_sdk" --serial emulator-5580 --audio --installed-sdk --config "$config" --work "$work" "${extra[@]}"
              cp "$work/window.log" "$work/$mode.log"
              cp "$work/results.json" "$work/$mode-results.json"
              for image in before resumed; do
                if [ -f "$work/$image.png" ]; then cp "$work/$image.png" "$work/$mode-$image.png"; fi
              done
              for entry in explicit declarative; do
                work="build-android/lua-audio-$config"
                mise run test-android-window -- --sdk "$acceptance_sdk" --serial emulator-5580 --audio --language lua --entry "$entry" --config "$config" --work "$work" "${extra[@]}"
                cp "$work/window.log" "$work/$entry-$mode.log"
                cp "$work/results.json" "$work/$entry-$mode-results.json"
                for image in before resumed; do
                  if [ -f "$work/$image.png" ]; then cp "$work/$image.png" "$work/$entry-$mode-$image.png"; fi
                done
              done
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-foundation-${{ github.sha }}-${{ matrix.config }}
          path: |
            build-android-rust/*.log
            build-android-rust/*results.json
            build-android/*.log
            build-android/*-results.json
            build-android/toolchain.json
            build-android/linux-sdk/malvado-archives.json
            build-android/rust-window-*/*.log
            build-android/rust-window-*/*results.json
            build-android/rust-window-*/*.png
            build-android/window-*/*.log
            build-android/window-*/results.json
            build-android/window-*/*.png
            build-android/lua-*/*.log
            build-android/lua-*/*results.json
            build-android/c-lifecycle-*/*.log
            build-android/c-lifecycle-*/*results.json
            build-android/c-lifecycle-*/*.png
            build-android/lua-*/*.png
            build-android/c-audio-*/*.log
            build-android/c-audio-*/*results.json
            build-android/c-audio-*/*.png
          if-no-files-found: warn
          retention-days: 14
