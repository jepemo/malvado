name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-sdk:
    name: Rust installed SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run test-rust
  sdk-package:
    name: Build SDK archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - run: mise run package-sdk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-${{ matrix.os }}
          path: |
            build/sdk-package/*.tar.gz
            build/sdk-package/*.sha256
          if-no-files-found: error
          retention-days: 3
  sdk-consumer:
    name: Test SDK on a fresh runner (${{ matrix.os }})
    needs: sdk-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-${{ matrix.os }}
          path: sdk-artifact
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libgl1-mesa-dri xvfb xauth ninja-build
      - name: Test SDK and game exports on Linux
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid"' EXIT
          sleep 2
          set -- "$PWD"/sdk-artifact/*.tar.gz
          test "$#" -eq 1 && test -f "$1"
          cmake -DARCHIVE="$1" -DSOURCE="$PWD" -DWORK="$RUNNER_TEMP/malvado-sdk-test" -DVISUAL=ON -P tests/sdk_clean.cmake
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Test SDK and game exports on macOS
        if: runner.os == 'macOS'
        run: |
          set -- "$PWD"/sdk-artifact/*.tar.gz
          test "$#" -eq 1 && test -f "$1"
          cmake -DARCHIVE="$1" -DSOURCE="$PWD" -DWORK="$RUNNER_TEMP/malvado-sdk-test" -DVISUAL=OFF -P tests/sdk_clean.cmake
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15] # Windows belongs to alpha.9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Build and test
        run: mise run test
      - name: Test Lua with headless backend
        run: mise run test-headless
  c-core:
    name: C core without Lua or raylib (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Build and test
        run: |
          mise run test-c
          test ! -d build-c/_deps
      - name: Test installed API from a C consumer
        run: |
          cmake --install build-c --prefix "$RUNNER_TEMP/malvado-sdk"
          cc -I"$RUNNER_TEMP/malvado-sdk/include" examples/c/clock/main.c "$RUNNER_TEMP/malvado-sdk/lib/libmalvado_core.a" -lm -o "$RUNNER_TEMP/malvado-c-example"
          "$RUNNER_TEMP/malvado-c-example"
          cc -I"$RUNNER_TEMP/malvado-sdk/include" examples/c/processes/main.c "$RUNNER_TEMP/malvado-sdk/lib/libmalvado_core.a" -lm -o "$RUNNER_TEMP/malvado-c-processes"
          "$RUNNER_TEMP/malvado-c-processes"
  c-assets:
    name: C atlas without Lua or raylib
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run test-c-assets
  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev clang
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Static analysis of project C sources
        run: |
          for source in src/cli.c src/game_main.c src/native_game_main.c src/game_directory.c src/binding/runtime.c src/platform/raylib.c src/platform/headless.c src/platform/image.c src/platform/input.c src/platform/time.c src/platform/fade.c src/assets/atlas.c src/core/clock.c src/core/schedule.c src/core/context.c src/core/process.c; do
            clang --analyze -Werror -Xanalyzer -analyzer-output=text -std=c11 -DMALVADO_BUILD_ASSETS -Isrc/include -Isrc -Ibuild/_deps/cjson-src -Ibuild/_deps/lua-src/src -Ibuild/_deps/raylib-src/src "$source"
          done
          clang --analyze -Werror -Xanalyzer -analyzer-output=text -std=c11 -DMALVADO_EXPORT_GRAPHICS -DMALVADO_LAUNCHER_REL='"../libexec/malvado/malvado-game"' -DMALVADO_NATIVE_LAUNCHER_REL='"../libexec/malvado/malvado-native-game"' -DMALVADO_NOTICES_REL='"../share/licenses/malvado"' -DMALVADO_SDK_ROOT_REL='".."' -Isrc src/export.c
          clang --analyze -Werror -Xanalyzer -analyzer-output=text -std=c11 -DMALVADO_EXPORT_GRAPHICS -Isrc src/build.c
  visual:
    name: Sleep and freeze rendering (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xauth xdotool
      - name: Test rendering
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid"' EXIT
          sleep 2
          mise run test-visual
          mise run test-g0
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'
  docs:
    name: Verify API catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run catalog
      - run: git diff --exit-code -- docs/api/catalog.json docs/api/inventory.md
      - name: Build documentation
        run: |
          python -m pip install -r docs/requirements.txt
          python -m mkdocs build --strict -f docs/mkdocs.yml
  sdk-candidate:
    name: Collect tested SDK candidates
    if: github.event_name != 'pull_request'
    needs: [sdk-package, sdk-consumer, build, c-core, c-assets, sanitizers, visual, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sdk-*
          path: sdk-candidate
          merge-multiple: true
      - name: Verify candidate files
        run: |
          cd sdk-candidate
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.tar.gz.sha256' | wc -l)" -eq 2
          sha256sum -c ./*.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-candidate-${{ github.sha }}
          path: sdk-candidate/*
          if-no-files-found: error
          retention-days: 14
