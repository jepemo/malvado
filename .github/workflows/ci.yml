name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14] # Windows is added in alpha.6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Build and test
        run: mise run test
      - name: Test Lua with headless backend
        run: mise run test-headless
  c-core:
    name: C core without Lua or raylib (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Build and test
        run: |
          mise run test-c
          test ! -d build-c/_deps
      - name: Test installed API from a C consumer
        run: |
          cmake --install build-c --prefix "$RUNNER_TEMP/malvado-sdk"
          cc -I"$RUNNER_TEMP/malvado-sdk/include" examples/c/clock/main.c "$RUNNER_TEMP/malvado-sdk/lib/libmalvado_core.a" -lm -o "$RUNNER_TEMP/malvado-c-example"
          "$RUNNER_TEMP/malvado-c-example"
          cc -I"$RUNNER_TEMP/malvado-sdk/include" examples/c/processes/main.c "$RUNNER_TEMP/malvado-sdk/lib/libmalvado_core.a" -lm -o "$RUNNER_TEMP/malvado-c-processes"
          "$RUNNER_TEMP/malvado-c-processes"
  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev clang
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Static analysis of project C sources
        run: |
          for source in src/binding/runtime.c src/platform/raylib.c src/platform/headless.c src/platform/image.c src/platform/input.c src/assets/atlas.c src/core/clock.c src/core/schedule.c src/core/context.c src/core/process.c; do
            clang --analyze -Werror -Xanalyzer -analyzer-output=text -std=c11 -DMALVADO_BUILD_ASSETS -Iinclude -Isrc -Ibuild/_deps/cjson-src -Ibuild/_deps/lua-src/src -Ibuild/_deps/raylib-src/src "$source"
          done
  visual:
    name: Sleep and freeze rendering (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xauth xdotool
      - name: Test rendering
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid"' EXIT
          sleep 2
          mise run test-visual
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'
  docs:
    name: Verify API catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run catalog
      - run: git diff --exit-code -- docs/api/catalog.json docs/api/inventory.md
      - name: Build documentation
        run: |
          python -m pip install -r requirements-docs.txt
          python -m mkdocs build --strict
