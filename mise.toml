[tools]
cmake = "3.31.6"
python = "3.11.16"
rust = { version = "1.99.1", profile = "minimal", components = ["clippy", "rustfmt"] }

[tasks.configure]
description = "Configure the standard debug build"
run = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug"

[tasks.build]
description = "Build the runtime and examples"
depends = ["configure"]
run = "cmake --build build --config Debug --parallel"

[tasks.test]
description = "Build and run the standard tests"
depends = ["build"]
run = "ctest --test-dir build -C Debug --output-on-failure"

[tasks.hello]
description = "Build and run the Lua hello example (requires a display)"
depends = ["build"]
run = "./build/malvado run examples/helloworld/main.lua"

[tasks.package-sdk]
description = "Create a local SDK archive and checksum"
depends = ["build"]
run = "cmake -DBUILD=build -DOUTPUT=build/sdk-package -DCONFIG=Debug -P tools/cmake/package-sdk.cmake"

[tasks.install]
description = "Build and install the development SDK for this user"
depends = ["build"]
run = "python3 tools/dev_sdk.py install --build build"

[tasks.uninstall]
description = "Remove the managed development SDK"
run = "python3 tools/dev_sdk.py uninstall"

[tasks.configure-c]
description = "Configure the C-only build without dependency downloads"
run = "cmake -S . -B build-c -DCMAKE_BUILD_TYPE=Debug -DMALVADO_BUILD_LUA=OFF -DMALVADO_BUILD_RAYLIB=OFF -DCMAKE_INSTALL_LIBDIR=lib -DFETCHCONTENT_FULLY_DISCONNECTED=ON"

[tasks.build-c]
description = "Build the C-only runtime and examples"
depends = ["configure-c"]
run = "cmake --build build-c --config Debug --parallel"

[tasks.test-c]
description = "Build and test the C-only runtime"
depends = ["build-c"]
run = "ctest --test-dir build-c -C Debug --output-on-failure"

[tasks.configure-c-assets]
description = "Configure C atlas support without Lua or raylib"
run = "cmake -S . -B build-c-assets -DCMAKE_BUILD_TYPE=Debug -DMALVADO_BUILD_LUA=OFF -DMALVADO_BUILD_RAYLIB=OFF -DMALVADO_BUILD_ASSETS=ON"

[tasks.build-c-assets]
description = "Build C atlas support"
depends = ["configure-c-assets"]
run = "cmake --build build-c-assets --config Debug --parallel"

[tasks.test-c-assets]
description = "Test C atlas support without Lua or raylib"
depends = ["build-c-assets"]
run = "ctest --test-dir build-c-assets -C Debug --output-on-failure"

[tasks.configure-headless]
description = "Configure the Lua build without graphics"
run = "cmake -S . -B build-lua-headless -DCMAKE_BUILD_TYPE=Debug -DMALVADO_BUILD_RAYLIB=OFF"

[tasks.build-headless]
description = "Build the Lua headless runtime"
depends = ["configure-headless"]
run = "cmake --build build-lua-headless --config Debug --parallel"

[tasks.test-headless]
description = "Build and test the Lua headless runtime"
depends = ["build-headless"]
run = "ctest --test-dir build-lua-headless -C Debug --output-on-failure"

[tasks.configure-visual]
description = "Configure graphics smoke tests"
run = "cmake -S . -B build-visual -DCMAKE_BUILD_TYPE=Debug -DMALVADO_VISUAL_TESTS=ON"

[tasks.build-visual]
description = "Build graphics smoke tests"
depends = ["configure-visual"]
run = "cmake --build build-visual --config Debug --parallel"

[tasks.test-visual]
description = "Run graphics smoke tests (requires a display or virtual display)"
depends = ["build-visual"]
run = "ctest --test-dir build-visual -C Debug -R '^visual_' --output-on-failure"

[tasks.catalog]
description = "Download pinned API sources and regenerate the catalog"
run = ["python3 docs/tools/fetch_api_sources.py", "python3 docs/tools/catalog_api.py"]

[tasks.configure-g0]
description = "Configure the experimental GUI prototypes"
run = "cmake -S . -B build-g0 -DCMAKE_BUILD_TYPE=Debug -DMALVADO_BUILD_GUI_G0=ON -DMALVADO_VISUAL_TESTS=ON"

[tasks.build-g0]
description = "Build the experimental GUI prototypes"
depends = ["configure-g0"]
run = "cmake --build build-g0 --config Debug --target gui-g0-raygui gui-g0-imgui gui-g0-imgui-raylib --parallel"

[tasks.test-g0]
description = "Smoke test the GUI prototypes (requires a display)"
depends = ["build-g0"]
run = "ctest --test-dir build-g0 -C Debug -R '^visual_(gui|imgui|imgui_raylib)_g0$' --output-on-failure"

[tasks.test-rust]
description = "Test Rust against a relocated installed C-only SDK"
run = "python3 tools/test_rust.py"

[tasks.test-rust-miri]
description = "Verify Rust future, wake and cancellation ownership with optional Miri toolchain"
run = 'MALVADO_SDK_PREFIX="$PWD/build-rust/Debug/relocated sdk" mise exec --cd tools/miri -- cargo miri test --manifest-path ../../bindings/rust/Cargo.toml -p malvado --lib'

[tasks.test-rust-sanitize]
description = "Test Rust callbacks with an ASan/UBSan native core"
run = "python3 tools/test_rust_sanitize.py"

[tasks.test-headless-no-cargo]
description = "Build and test Lua without Cargo on the native build PATH"
run = "python3 tools/test_lua_no_cargo.py"

[tasks.test-rust-assets]
description = "Test optional Rust atlas services against relocated assets SDKs"
run = "python3 tools/test_rust_assets.py"

[tasks.test-rust-assets-sanitize]
description = "Test Rust atlas ownership against ASan/UBSan native assets"
run = "python3 tools/test_rust_sanitize.py --assets"

[tasks.test-rust-graphics]
description = "Test Rust window and input against relocated graphics SDKs (requires display)"
run = "python3 tools/test_rust_graphics.py"
